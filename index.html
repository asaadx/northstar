<!doctype html>
<html lang="en">

      name="description"
      content="Build a daily streak and unlock rewards along the way. Built for people that struggle with consistency."

    <meta property="og:site_name" content="Northstar" />
    <meta property="og:url" content="https://northstar-asaadx.vercel.app/" />

    <meta
      property="og:description"
      content="Build a daily streak and unlock rewards along the way. Built for people that struggle with consistency."
    />
    <meta property="og:image" content="https://northstar-asaadx.vercel.app/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An eight-pointed northstar glowing on a dark navy field." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
